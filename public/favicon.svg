<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Card 1 (left, back) -->
  <rect x="8" y="8" width="30" height="42" rx="3" fill="url(#card1)" stroke="#c084fc" stroke-width="1.5" transform="rotate(-12, 23, 29)" filter="url(#shadow)"/>
  <rect x="11" y="12" width="24" height="16" rx="1" fill="#1e1b4b" transform="rotate(-12, 23, 29)" opacity="0.4"/>
  
  <!-- Card 2 (right, front) -->
  <rect x="26" y="8" width="30" height="42" rx="3" fill="url(#card2)" stroke="#a5b4fc" stroke-width="1.5" transform="rotate(12, 41, 29)" filter="url(#shadow)"/>
  <rect x="29" y="12" width="24" height="16" rx="1" fill="#1e1b4b" transform="rotate(12, 41, 29)" opacity="0.4"/>
  
  <!-- Euro Coin -->
  <circle cx="32" cy="50" r="13" fill="url(#coin)" stroke="#fde047" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="32" cy="50" r="9" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5"/>
  <text x="32" y="55" fill="#78350f" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">€</text>
</svg>